<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found – Campus Craft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./images/logo-white.png" />
    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="404.css" />
  </head>
  <body>
    <div class="theme-toggles">
      <button
        class="icon-btn rtl-btn"
        id="rtlToggle"
        title="RTL Mode"
        aria-label="Toggle RTL mode"
        type="button"
      >
        <i data-lucide="arrow-left-right"></i>
      </button>

      <button
        class="icon-btn dark-btn"
        id="darkToggle"
        title="Dark Mode"
        aria-label="Toggle dark mode"
        type="button"
      >
        <i data-lucide="moon"></i>
      </button>
    </div>

    <main class="not-found-page">
      <div class="not-found__inner">
        <div class="not-found__icon">
          <i data-lucide="file-x"></i>
        </div>

        <h1 class="not-found__code">404</h1>

        <h2 class="not-found__title">Page not <span>found</span></h2>

        <p class="not-found__text">
          The page you're looking for doesn't exist or has been moved. Let's get
          you back to the right place.
        </p>

        <div class="not-found__actions">
          <a href="index.html" class="btn-primary"> Go to Home </a>
          <a href="products.html" class="btn-secondary"> Browse Products </a>
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@0.542.0/dist/umd/lucide.min.js"></script>

    <script src="main.js"></script>
  </body>
</html>
